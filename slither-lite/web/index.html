<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfaf8" />
    <link rel="icon" href="/zero-sum-logo.svg" type="image/svg+xml" />
    <title>Zero Sum · games decided by skill</title>
    <meta name="description" content="Zero Sum hosts games whose outcome comes from skill rather than luck. Pick a game, pick a level, and play in the browser or with a bot over the API." />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#/" aria-label="Zero Sum home"><img class="brand-mark" src="/zero-sum-logo.svg" alt="" /><span class="brand-name">Zero Sum</span></a>
      <nav id="site-nav" aria-label="Main"></nav>
      <span id="paper-badge" class="paper-badge" title="Every level currently open uses a simulated ledger" hidden>Paper money</span>
      <div id="account" class="account"></div>
    </header>
    <main id="main">
      <section id="view-home" class="page" aria-label="Games"></section>
      <section id="view-about" class="page" aria-label="About" hidden></section>
      <section id="view-game" class="page" aria-label="Levels" hidden></section>
      <section id="view-play" hidden></section>
      <section id="view-rules" class="page" aria-label="Rules" hidden></section>
      <section id="view-docs" class="page" aria-label="API Docs" hidden></section>
    </main>
    <dialog id="auth-dialog" class="auth-dialog"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
